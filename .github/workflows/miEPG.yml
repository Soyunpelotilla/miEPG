name: miEPG 

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils libtimedate-perl

    - name: Dar permisos de ejecución al script
      run: |
        chmod +x .github/workflows/EPG_script.sh
        chmod +x .github/workflows/miEPG.sh || true
        chmod +x miEPG.sh || true

    - name: Ejecutar script
      run: |
        .github/workflows/EPG_script.sh || .github/workflows/miEPG.sh || ./miEPG.sh
        ls -lh miEPG.xml

    - name: Configurar identidad de Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Subir archivos a main
      run: |
        git add miEPG.xml canales_epg*.txt epgs.txt -f
        if [ -f epg_acumulado.xml ]; then
          git add epg_acumulado.xml -f
        fi
        git diff --cached --quiet || git commit -m "Nuevo miEPG.xml $(date '+%d/%m %H:%M')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
