name: miEPG 

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
   contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Comprobar si xmllint está instalado
      run: |
        if ! command -v xmllint &> /dev/null
        then
          echo "xmllint no está instalado. Instalando..."
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
        else
          echo "xmllint ya está instalado"
        fi

    - name: Configurar Python (para fix Gracenote)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Dar permisos de ejecución al script
      run: |
        chmod +x .github/workflows/EPG_script.sh

    - name: Ejecutar script
      run: .github/workflows/EPG_script.sh

    - name: Configurar identidad de Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Subir archivos
      run: |
        git add .
        git diff --cached --quiet || git commit -m "Nuevo miEPG.xml"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
